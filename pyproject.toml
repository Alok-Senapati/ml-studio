[project]
name = "ml-studio"
version = "0.1.0"
description = "ML Engineering Platform & Projects"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libraries/*",
    "projects/*",
]

[tool.pytest.ini_options]
testpaths = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
